<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">brave-api-python animated banner</title>
  <desc id="desc">A dark GitHub-style banner with an orange animated search network.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--bg-start)"/>
      <stop offset="1" stop-color="var(--bg-end)"/>
    </linearGradient>
    <linearGradient id="orange" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D95321"/>
      <stop offset="0.5" stop-color="#FE7039"/>
      <stop offset="1" stop-color="#FFB088"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FE7039" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FE7039" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="var(--grid)" stroke-opacity="0.08"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      :root {
        --bg-start: #0D1117;
        --bg-end: #161B22;
        --surface: #161B22;
        --surface-strong: #0D1117;
        --border: #30363D;
        --text: #C9D1D9;
        --muted: #8B949E;
        --grid: #C9D1D9;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg-start: #FFFFFF;
          --bg-end: #F6F8FA;
          --surface: #FFFFFF;
          --surface-strong: #F6F8FA;
          --border: #D0D7DE;
          --text: #1F2328;
          --muted: #656D76;
          --grid: #57606A;
        }
      }

      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="18" fill="url(#background)"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <ellipse cx="1080" cy="90" rx="300" ry="220" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="0" y="0" width="1280" height="3" rx="1.5" fill="url(#orange)"/>
  <rect x="0" y="397" width="1280" height="3" rx="1.5" fill="url(#orange)"/>

  <!-- Clear animated data pipeline -->
  <g transform="translate(760 64)">
    <rect width="440" height="260" rx="16" fill="var(--surface)" stroke="var(--border)"/>
    <text x="26" y="31" class="mono" font-size="12" letter-spacing="1.5" fill="var(--muted)">LIVE REQUEST PIPELINE</text>
    <circle cx="403" cy="25" r="5" fill="#FE7039">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <g class="mono" font-size="11">
      <text x="34" y="70" fill="var(--muted)">QUERY</text>
      <text x="178" y="70" fill="var(--muted)">ENGINE</text>
      <text x="326" y="70" fill="var(--muted)">RESULT</text>
    </g>
    <path d="M48 108H390" stroke="var(--border)" stroke-width="3" stroke-linecap="round"/>
    <path d="M48 108H390" stroke="#FE7039" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g fill="#FE7039" filter="url(#softGlow)">
      <circle cx="48" cy="108" r="8"/>
      <circle cx="220" cy="108" r="8">
        <animate attributeName="r" values="7;12;7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="390" cy="108" r="8"/>
    </g>
    <path d="M48 108V164H390V108" stroke="#FE7039" stroke-opacity=".22" stroke-width="1" stroke-dasharray="3 8"/>

    <g class="mono" font-size="12">
      <rect x="25" y="185" width="118" height="43" rx="8" fill="#211711" stroke="#5D2E1D"/>
      <text x="39" y="203" fill="#FFB088">ask()</text>
      <text x="39" y="218" fill="#8B949E">streaming</text>
      <rect x="161" y="185" width="118" height="43" rx="8" fill="var(--surface-strong)" stroke="var(--border)"/>
      <text x="175" y="203" fill="var(--text)">search()</text>
      <text x="175" y="218" fill="var(--muted)">typed SERP</text>
      <rect x="297" y="185" width="118" height="43" rx="8" fill="var(--surface-strong)" stroke="var(--border)"/>
      <text x="311" y="203" fill="var(--text)">MCP</text>
      <text x="311" y="218" fill="var(--muted)">ready</text>
    </g>
    <rect x="25" y="145" width="72" height="2" rx="1" fill="#FE7039">
      <animate attributeName="x" values="25;343;25" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(80 67)">
    <circle cx="0" cy="-5" r="4" fill="#FE7039">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="0" class="mono" font-size="14" letter-spacing="0.5" fill="var(--muted)">github.com/iqbalmh18/brave-api</text>
  </g>

  <text x="78" y="158" class="sans" font-size="62" font-weight="800" fill="url(#orange)">Brave API</text>
  <text x="80" y="198" class="sans" font-size="18" fill="var(--text)">Async Python client for Brave Search and Brave Ask</text>
  <text x="80" y="228" class="sans" font-size="18" fill="var(--muted)">typed results · streaming answers · built-in MCP server</text>

  <g transform="translate(80 266)">
    <g class="mono" font-size="14" font-weight="700">
      <rect width="92" height="34" rx="17" fill="#211711" stroke="#FE7039"/>
      <text x="46" y="22" text-anchor="middle" fill="#FFB088">ASK</text>
      <rect x="106" width="108" height="34" rx="17" fill="var(--surface)" stroke="var(--border)"/>
      <text x="160" y="22" text-anchor="middle" fill="var(--text)">SEARCH</text>
      <rect x="228" width="92" height="34" rx="17" fill="var(--surface)" stroke="var(--border)"/>
      <text x="274" y="22" text-anchor="middle" fill="var(--text)">MCP</text>
    </g>
    <text y="78" class="mono" font-size="14" fill="var(--muted)">$ uv add brave-api-python</text>
    <rect x="226" y="65" width="8" height="18" fill="#FE7039">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
