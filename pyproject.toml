[project]
name = "brave-api-python"
description = "An asynchronous Python client for the Brave Ask & Search API, with a built-in MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "iqbalmh18" },
]

keywords = [
    "brave",
    "search",
    "ai",
    "async",
    "client",
    "mcp",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dynamic = ["version"]

dependencies = [
    "curl-cffi>=0.15.0",
    "pillow>=12.2.0",
    "pydantic>=2.11.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=3.4.3",
]
build = [
    # Pinned to the uv version that produced uv.lock, so the lockfile format
    # stays compatible inside the semantic-release Docker container.
    "uv~=0.11.31",
]

[project.scripts]
brave-api-mcp = "brave_api.mcp.server:main"

[project.urls]
Homepage = "https://github.com/iqbalmh18/brave-api"
Repository = "https://github.com/iqbalmh18/brave-api"
Documentation = "https://github.com/iqbalmh18/brave-api#readme"
Issues = "https://github.com/iqbalmh18/brave-api/issues"

[dependency-groups]
dev = [
    "build>=1.2.0",
    "fastmcp>=3.4.3",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "python-semantic-release>=10.6.1",
    "ruff>=0.13.0",
    "twine>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "brave_api/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["brave_api"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".gitignore",
    ".ruff_cache",
    ".pytest_cache",
    ".vscode",
    "*.svg",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end tests that hit the live Brave API",
]

[tool.coverage.run]
source = ["brave_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["brave_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = [
    "brave_api",
    "tests",
]
venvPath = "."
venv = ".venv"

[tool.semantic_release]
version_variables = ["brave_api/_version.py:__version__"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
commit_parser = "conventional"
major_on_zero = true
allow_zero_version = true
# The semantic-release action runs in its own Docker container without uv;
# install it via the `build` extra, resync the lockfile after the version
# bump, then build. $PACKAGE_NAME is injected by semantic-release.
build_command = """
python -m pip install -e '.[build]'
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]
